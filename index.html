<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmapper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- メインエリア（左側） -->
    <main class="left-section">
      <!-- ヘッダーエリア -->
      <div class="top-header">
        <div class="header-left">
          <h1 class="month-title">8月</h1>
          <div class="week-selector">
            <button class="nav-btn">&lt;</button>
            <span>1日 〜 7日</span>
            <button class="nav-btn">&gt;</button>
          </div>
        </div>

        <!-- 総合達成率（バー付き） -->
        <div class="achievement-box">
          <span class="achievement-title">総合達成率</span>
          <div class="achievement-content">
            <div class="achievement-value"><span id="totalProgress">0</span>%</div>
            <div class="progress-bar-bg total-bar-bg">
              <div class="progress-bar-fill" id="totalProgressBarFill" style="width: 0%;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 週間スケジュール（縦並び） -->
      <div class="weekly-schedule">
        <div class="day-row" data-day-index="0"><div class="day-label">月</div><div class="task-container drop-zone"></div></div>
        <div class="day-row" data-day-index="1"><div class="day-label">火</div><div class="task-container drop-zone"></div></div>
        <div class="day-row" data-day-index="2"><div class="day-label">水</div><div class="task-container drop-zone"></div></div>
        <div class="day-row" data-day-index="3"><div class="day-label">木</div><div class="task-container drop-zone"></div></div>
        <div class="day-row" data-day-index="4"><div class="day-label">金</div><div class="task-container drop-zone"></div></div>
        <div class="day-row" data-day-index="5"><div class="day-label">土</div><div class="task-container drop-zone"></div></div>
        <div class="day-row" data-day-index="6"><div class="day-label">日</div><div class="task-container drop-zone"></div></div>
      </div>

      <!-- ▼ ごほうびパズル解放エリア ▼ -->
      <div class="puzzle-section">
        <div class="puzzle-header-area">
          <h3>🎯 ごほうびパズル（達成率でイラストがひらく！）</h3>
          <label class="image-upload-btn">
            📷 画像をかえる
            <input type="file" id="puzzleImageInput" accept="image/*" style="display: none;">
          </label>
        </div>
        <div class="puzzle-wrapper">
          <div class="puzzle-image-bg" id="puzzleImageBg"></div>
          <div class="puzzle-grid" id="puzzleGrid"></div>
        </div>
      </div>

      <!-- ▼ 課題別達成率エリア ▼ -->
      <div class="progress-section">
        <h3>課題別達成率</h3>
        <div class="progress-grid" id="progressGrid"></div>
      </div>
    </main>

    <!-- サイドバー（右側：課題欄） -->
    <aside class="right-section">
      <h2>課題</h2>

      <div class="auto-assign-box">
        <label for="targetDateInput">いつまでに終わらせる？</label>
        <input type="date" id="targetDateInput">
        <button id="autoAssignBtn">🎲 お任せ自動割り振り</button>
      </div>

      <div class="add-card-form">
        <input type="text" id="subjectTitle" placeholder="教科名（例: 現代文）">
        <input type="number" id="subjectPages" placeholder="総ページ数" min="1">
        <button id="addSubjectBtn">課題を追加</button>
      </div>

      <div class="subject-list" id="subjectList"></div>
    </aside>

  </div>

  <script src="script.js"></script>
</body>
</html>
